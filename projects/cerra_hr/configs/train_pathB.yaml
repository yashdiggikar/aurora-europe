precision: bf16
grad_checkpoint: true
clip_grad_norm: 1.0

stage1: {train_parts: ["decoder"],                           lr: 3.0e-4, epochs: 2}
stage2: {train_parts: ["decoder","level_agg"],               lr: 3.0e-5, epochs: 3}
stage3: {train_parts: ["decoder","level_agg","backbone"],    lr: 1.0e-5, epochs: 3}

batch_size: 1
num_workers: 2
val_interval_steps: 500
save_dir: runs/ckpts

# -------------------------------------------------------
# what we ask the model to predict / learn
# -------------------------------------------------------
target_vars:
  surf:  ["2t", "10u", "10v", "sp", "msl"]        # surface variables
  atmos: ["t", "u", "v", "rh", "z"]               # 3-D atmospheric variables (13 levels)

# relative importance of each term in total loss
loss_weights:
  "surf:2t": 1.0
  "surf:10u": 0.5
  "surf:10v": 0.5
  "surf:sp":  0.25
  "surf:msl": 0.25
  "atmos:t":  0.25
  "atmos:u":  0.25
  "atmos:v":  0.25
  "atmos:rh": 0.25
  "atmos:z":  0.25
